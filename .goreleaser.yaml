# GoReleaser builds the downloadable binaries and publishes a GitHub Release on every `v*` tag
# (see .github/workflows/release.yml). The Docker images are built separately in that workflow.
#
# Two binaries from the go.work monorepo: `akili` (the control plane, with the web UI embedded) and
# `akili-agent`. Module tags such as proto/v0.1.0 are ignored here.
# Validate locally with `goreleaser check`; try a build with `goreleaser build --snapshot --clean`.
version: 2

project_name: akili

before:
  hooks:
    # Build the Vue UI into server/internal/web/dist, which the akili binary embeds.
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: akili
    dir: server
    main: ./cmd/akili
    binary: akili
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Enterprise build: the Enterprise code stays inactive (Community) until a license is installed.
    tags:
      - enterprise
    ldflags:
      - -s -w
      - -X github.com/goakili/akili/server/internal/config.Version={{ .Version }}
      - -X github.com/goakili/akili/server/internal/enterprise.embeddedPublicKey={{ envOrDefault "LICENSE_PUBLIC_KEY" "" }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: akili-agent
    dir: agent
    main: ./cmd/akili-agent
    binary: akili-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: akili
    ids: [akili]
    name_template: "akili_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

  - id: akili-agent
    ids: [akili-agent]
    name_template: "akili-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - agent/README.md

checksum:
  name_template: "checksums.txt"

# Homebrew formula for the agent, pushed to github.com/goakili/homebrew-tap on every release.
brews:
  - name: akili-agent
    ids: [akili-agent]
    homepage: "https://goakili.dev"
    description: "Agent for Akili, the security-first control plane for autonomous AI operator agents"
    license: "AGPL-3.0-or-later"
    directory: Formula
    repository:
      owner: goakili
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: Akili Agent
      email: agent@goakili.dev
    install: |
      bin.install "akili-agent"
    post_install: |
      (var/"akili-agent").mkpath
      (var/"log").mkpath
    caveats: |
      Enroll the agent once with the join token from your control plane (Agents → Add agent):

        AKILI_JOIN_TOKEN=akj_... akili-agent enroll --url https://akili.example.com --state-dir #{var}/akili-agent

      Then start it in the background, now and at login:

        brew services start akili-agent

      Logs: #{var}/log/akili-agent.log
    service: |
      run [opt_bin/"akili-agent", "start", "--state-dir", var/"akili-agent"]
      keep_alive true
      log_path var/"log/akili-agent.log"
      error_log_path var/"log/akili-agent.log"
    test: |
      assert_match version.to_s, shell_output("#{bin}/akili-agent version")

git:
  # Globs passed to `git describe --exclude`, so the previous release is never a module tag.
  ignore_tags:
    - "proto/*"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: goakili
    name: akili
  draft: false
  prerelease: auto
  name_template: "Akili {{ .Tag }}"
  footer: |
    ---

    ## Docker images

    - Control plane: `jkaninda/akili` on Docker Hub and `ghcr.io/goakili/akili`
    - Agent: `jkaninda/akili-agent` on Docker Hub and `ghcr.io/goakili/akili-agent`

    Both are tagged `{{ .Version }}`, and `latest` for stable releases. The control plane image also
    serves the agent binaries to `install-agent.sh`, so agents installed from it always match it.
